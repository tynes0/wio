name: release validation

on:
  workflow_dispatch:
    inputs:
      vm_native_requirements_only:
        description: "Scoped 0.20.3 native adapter requirements validation"
        type: boolean
        default: false
      vm_project_platform:
        description: "Platform for scoped VM patch validation; retain other platform evidence separately"
        type: choice
        options: [all, windows-latest, ubuntu-latest, macos-15]
        default: all
      vm_bytecode_first_only:
        description: "Scoped 0.20.2 bytecode-first VM project validation"
        type: boolean
        default: false
      vm_budget_only:
        description: "Scoped 0.20.1 VM execution-policy patch validation"
        type: boolean
        default: false
      project_check_only:
        description: "Scoped 0.20.0 project-check release validation; full suite waived by owner"
        type: boolean
        default: false
      layout_only:
        description: "Run only build-layout/launcher follow-up; retain the full base-commit CI evidence separately"
        type: boolean
        default: false
      native_install_probe:
        description: "Isolate the Linux native-install incremental build gate"
        type: boolean
        default: false
  push:
    branches:
      - main
      - "releases/**"
  pull_request:

concurrency:
  group: release-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vm-project-release:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.vm_budget_only || inputs.vm_bytecode_first_only || inputs.vm_native_requirements_only) }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((inputs.vm_project_platform == '' || inputs.vm_project_platform == 'all') && '["ubuntu-latest","windows-latest","macos-15"]' || format('["{0}"]', inputs.vm_project_platform)) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-binutils
      - name: Select Windows generated-code toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"C:/msys64/ucrt64/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'
      - name: Configure release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build affected VM, CLI, artifact and version gates
        run: >
          cmake --build build --parallel 2 --target wio_selfhost_cli
          wio_vm_scalar_execution_test wio_vm_coroutine_execution_test
          wio_vm_exceptional_cleanup_test wio_vm_artifact_codec_test
          wio_vm_artifact_cohort_test wio_vm_artifact_generation_test
          wio_vm_artifact_extra_registry wio_sdk_version_contract_test wio_vm_native_preflight_test
          wio_wir_native_requirements_test wio_wir_native_bridge_plan_test
      - name: Qualify execution policy and affected regressions
        run: >
          ctest --test-dir build -C Release --output-on-failure --no-tests=error
          -R "^(wio_vm_(native_requirements|bytecode_first|native_preflight|execution_budget|scalar_execution|coroutine_execution|exceptional_cleanup|artifact_codec|artifact_cohort|artifact_generation|executable_artifact|project_artifact|executable_cohort|native_bridge_project|native_project_cli)|wio_wir_native_(requirements|bridge_plan)|wio_project_analysis_check|wio_sdk_version_contract)$"
      - name: Preserve focused test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vm-project-${{ matrix.os }}
          path: build/Testing/Temporary/

  project-check-release:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.project_check_only }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-binutils
      - name: Select Windows generated-code toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"C:/msys64/ucrt64/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'
      - name: Configure release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build affected CLI and version contract
        run: cmake --build build --target wio_selfhost_cli wio_sdk_version_contract_test --parallel 2
      - name: Qualify analysis-only project checks and SDK metadata
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error -R "^(wio_project_analysis_check|wio_sdk_version_contract)$"
      - name: Preserve focused test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-check-${{ matrix.os }}
          path: build/Testing/Temporary/

  native-install-probe:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.native_install_probe }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build CLI and runtime for the installed consumer
        run: cmake --build build --target wio_playground wio_vm_runner --parallel 2
      - name: Validate incremental native installation
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error -R "^wio_vm_sdk_native_install$"
      - name: Preserve native install evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-install-probe
          path: build/Testing/Temporary/

  layout-follow-up:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.layout_only }}
    uses: ./.github/workflows/release-layout-validation.yml

  validate:
    if: ${{ !inputs.layout_only && !inputs.native_install_probe && !inputs.project_check_only && !inputs.vm_budget_only && !inputs.vm_bytecode_first_only && !inputs.vm_native_requirements_only }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MSVC developer command prompt
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up portable GNU backend on Windows
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-ninja

      - name: Ensure Ninja is available on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Validate language and standard-library freeze
        run: cmake --build build --target wio_tests_freeze

      - name: Validate core release matrix
        run: >
          ctest --test-dir build --output-on-failure
          -R "(wio_test_installed_package_qualification|wio_test_self_hosted_cli_smoke|wio_test_attribute_migration_smoke|wio_test_project_test_package_smoke|wio_test_package_cli_smoke|wio_test_project_cli_smoke|wio_test_hybrid_project_cli_smoke|wio_test_packaged_file_run_uses_user_cache|wio_test_binding_import_smoke|wio_test_binding_manifest_smoke|wio_test_std_process_run_smoke_run|wio_test_async_process_stream_run|wio_process_runtime_stress|wio_test_entry_default_void_run|wio_test_object_self_return_run|wio_test_generic_object_explicit_specialization_run|wio_test_generic_specialization_visibility_modules_run|wio_test_generic_default_type_arguments_run|wio_test_generic_partial_specialization_run|wio_test_generic_where_constraints_run|wio_test_generic_native_default_instantiation_run|wio_test_std_meta_pack_algorithms_run|wio_test_generic_component_constructor_deduction_run|wio_test_generic_object_constructor_deduction_run|wio_test_generic_const_parameters_run|wio_test_native_generic_specialized_component_run|wio_test_native_component_extension_run|wio_test_sdk_exported_inherited_host_interop|wio_test_sdk_015_attribute_metadata_host_interop|wio_test_fit_numeric_clamp_run|wio_test_example_plain_app_run|wio_test_example_native_app_run|wio_test_example_hybrid_module_run|wio_test_example_binding_import|wio_test_attribute_builtin_contract_unification|wio_test_attribute_typed_validator_target_run|wio_test_attribute_typed_receiver_pre_run|wio_test_attribute_checked_derive_run|wio_test_attribute_checked_derive_generic_run|wio_test_attribute_checked_derive_typed_receiver_run|wio_test_attribute_behavioral_pipeline_run|wio_test_attribute_behavioral_async_result_run|wio_test_attribute_scoped_activation_run|wio_test_attribute_compact_declaration_run|wio_invalid_attribute_typed_validator_target_mismatch|wio_invalid_attribute_typed_receiver_pre_mismatch|wio_invalid_attribute_derive_typed_target_mismatch|wio_invalid_generic_where_conjunction_reject|wio_invalid_generic_invariance_reject|wio_invalid_generic_specialization_requires_primary|wio_invalid_generic_specialization_argument_count_mismatch|wio_invalid_generic_specialization_duplicate|wio_invalid_generic_specialization_native_component|wio_invalid_generic_const_argument_kind_mismatch|wio_invalid_generic_const_function_argument_kind_mismatch|wio_invalid_generic_const_default_forward_reference|wio_invalid_native_extension_requires_native_component)"

      - name: Validate Wio 0.16 ownership and hosting matrix
        run: >
          ctest --test-dir build --output-on-failure
          -R "^(wio_sdk_016_callback_lifetime|wio_sdk_016_native_resource|wio_test_sdk_016_application_host_interop|wio_test_sdk_016_fixed_application_host_interop|wio_test_sdk_016_application_rollback_interop|wio_test_sdk_016_async_task_host_interop|wio_test_application_lifecycle_run|wio_test_application_delta_context_run|wio_test_application_schedule_run|wio_test_application_resource_schedule_run|wio_runtime_application_start_rollback|wio_test_async_cancellable_io_surface_check|wio_test_async_cancellation_outcome_run|wio_test_async_fs_io_run|wio_test_async_process_run|wio_test_async_process_stream_run|wio_test_async_net_io_run|wio_test_async_net_accept_run)$"

      - name: Validate Wio 0.17 application and SDK matrix
        run: >
          ctest --test-dir build --output-on-failure
          -R "^(wio_test_(sdk_017_application_schedule_interop|application_(attribute_model_run|mixed_model_run|composed_attribute_run)|cli_migrate_application_rewrite_run)|wio_invalid_application_attribute_(worker_rejected|unknown_dependency|fixed_frequency|multiple_lifecycle|start_parameter|update_return)|wio_invalid_system_(application_schedule_attribute|attribute_update_type|async_helper)|wio_invalid_application_async_helper)$"

      - name: Validate Lowered WIR C++ release gate
        run: >
          ctest --test-dir build --verbose
          -R "^wio_wir_cpp_(backend|backend_cli|generics|objects|async|native|sdk|application|reflection|packs_differential|behavioral_differential|project_differential)$"

      - name: Validate VM native discovery and project execution
        run: >
          ctest --test-dir build --output-on-failure
          -R "^wio_vm_native_(library_discovery|project_cli)$"

      - name: Validate C++ and VM native behavioral parity
        run: >
          ctest --test-dir build --output-on-failure
          -L "^native-differential$"

      - name: Validate standalone VM executable artifacts
        run: >
          ctest --test-dir build --output-on-failure
          -R "^(wio_vm_(artifact_codec|artifact_generation|artifact_cohort|executable_cohort|executable_artifact|project_artifact|sdk_module_adapter|sdk_module_artifacts|sdk_session_lifecycle|sdk_session_artifacts|task_source_shutdown|task_source_import|sdk_async_artifacts|sdk_task_inputs_artifacts|module_native_paths|sdk_native_dependencies|native_bundle_policy|sdk_native_install|project_library_cli|project_record_policy)|wio_process_utf8_project)$"

  sanitizers:
    if: ${{ !inputs.layout_only && !inputs.native_install_probe && !inputs.project_check_only && !inputs.vm_budget_only && !inputs.vm_bytecode_first_only && !inputs.vm_native_requirements_only }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure ASan and UBSan runtime tests
        run: >
          cmake -S . -B build-sanitize -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          -DWIO_BUILD_APP=OFF

      - name: Build sanitizer targets
        run: cmake --build build-sanitize --target wio_async_runtime_stress wio_process_runtime_stress wio_function_type_cpp_string_test wio_filesystem_policy_test wio_vm_native_bridge_test wio_vm_global_initialization_test

      - name: Run interim-release VM ownership and initialization sanitizer tests
        run: >
          ctest --test-dir build-sanitize --output-on-failure --no-tests=error
          -R "^(wio_vm_native_bridge|wio_vm_global_initialization)$"

      - name: Run async runtime sanitizer tests
        if: always()
        run: >
          ctest --test-dir build-sanitize --output-on-failure
          --repeat until-fail:5 -R "^wio_async_runtime_stress$"

      - name: Run process runtime sanitizer tests
        if: always()
        run: |
          set -o pipefail
          if ! ctest --test-dir build-sanitize --output-on-failure \
            --repeat until-fail:10 -R "^wio_process_runtime_stress$" \
            2>&1 | tee process-sanitizer.log; then
            {
              echo "### Process sanitizer failure"
              echo '```text'
              tail -n 200 process-sanitizer.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            details="$(tail -n 200 process-sanitizer.log)"
            details="${details//'%'/'%25'}"
            details="${details//$'\r'/'%0D'}"
            details="${details//$'\n'/'%0A'}"
            echo "::error title=Process sanitizer failure::$details"
            exit 1
          fi

      - name: Run compiler utility sanitizer tests
        if: always()
        run: >
          ctest --test-dir build-sanitize --output-on-failure
          -R "(wio_function_type_cpp_string|wio_filesystem_policy)"

      - name: Configure frontend fuzzer
        run: >
          cmake -S . -B build-fuzz -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=clang++
          -DWIO_BUILD_APP=OFF
          -DWIO_BUILD_FUZZERS=ON

      - name: Build frontend fuzzer
        run: cmake --build build-fuzz --target wio_frontend_fuzzer

      - name: Run sanitizer-guided corpus
        run: >
          ./build-fuzz/compiler/wio_frontend_fuzzer tests/fuzz/corpus
          -runs=2000 -max_len=65536 -timeout=5
