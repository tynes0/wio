name: v1 validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MSVC developer command prompt
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up portable GNU backend on Windows
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-ninja

      - name: Ensure Ninja is available on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Validate core release matrix
        run: >
          ctest --test-dir build --output-on-failure
          -R "(wio_test_project_cli_smoke|wio_test_hybrid_project_cli_smoke|wio_test_packaged_file_run_uses_user_cache|wio_test_binding_import_smoke|wio_test_binding_manifest_smoke|wio_test_std_process_run_smoke_run|wio_test_entry_default_void_run|wio_test_example_plain_app_run|wio_test_example_native_app_run|wio_test_example_hybrid_module_run|wio_test_example_binding_import)"

