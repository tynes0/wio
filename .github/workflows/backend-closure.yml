name: backend closure qualification

on:
  workflow_dispatch:
  push:
    branches: [main, "releases/**", feature/backend-closure]
    paths-ignore: ["docs/**", "*.md"]
  pull_request:
    paths-ignore: ["docs/**", "*.md"]

permissions:
  contents: read

concurrency:
  group: backend-closure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: ${{ matrix.os }} / ${{ matrix.config }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            config: Debug
          - os: ubuntu-latest
            config: Release
          - os: macos-15
            config: Release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-binutils
      - name: Select Windows generated-code toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"C:/msys64/ucrt64/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.config }}
      - name: Build compiler, CLI and runtime artifacts
        run: cmake --build build --target wio_selfhost_cli wio_vm_runner wio_backend_workspace_test wio_float_parse_portability_test --parallel 2
      - name: Qualify new functional closure cases
        run: >-
          ctest --test-dir build -C ${{ matrix.config }} --output-on-failure -j 1
          -R "^(wio_backend_workspace|wio_backend_unicode_outputs|wio_vm_platform_qualification|wio_float_parse_portability)$"
      - name: Preserve qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-closure-${{ matrix.os }}-${{ matrix.config }}
          path: build/Testing/Temporary/
